# Build and test on ROS 2 Jazzy (the ARISE reference distribution): ament linters, unit and functional tests.
# The test report (a check run with every test case) and the required-tests step make the results readable without
# the job log; the required tests must have run and passed, not been skipped.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
  checks: write
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: rula_msgs ros4hri_rula_assessor
          target-ros2-distro: jazzy
      - name: Test report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: ros_ws/build/ros4hri_rula_assessor/**/*.xml
          check_name: Tests on ROS 2 Jazzy
          include_passed: true
          detailed_summary: true
      - name: Required tests ran and passed
        if: always()
        shell: python3 {0}
        run: |
          import glob, sys, xml.etree.ElementTree as ET
          required = "test_mypy test_worked_example_through_tables_a_b_c test_flake8".split()
          cases = {}
          for f in glob.glob("ros_ws/build/ros4hri_rula_assessor/**/*.xml", recursive=True):
              for tc in ET.parse(f).iter("testcase"):
                  bad = tc.find("failure") is not None or tc.find("error") is not None
                  cases[tc.get("name")] = "skipped" if tc.find("skipped") is not None else ("failed" if bad else "passed")
          print(f"{len(cases)} test cases: " + ", ".join(f"{k}={v}" for k, v in sorted(cases.items())))
          missing = [n for n in required if cases.get(n) != "passed"]
          if missing:
              sys.exit(f"required tests not passed: {missing}")
      - name: Failure details as annotations (mypy findings, pytest collection errors; only when the job failed)
        if: failure()
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash && source ros_ws/install/setup.bash
          cd "$(find ros_ws/src -path '*ros4hri_rula_assessor/package.xml' -printf '%h\n' | head -1)"
          cfg=$(python3 -c 'import ament_mypy, os; print(os.path.join(os.path.dirname(ament_mypy.__file__), "configuration", "ament_mypy.ini"))')
          python3 -m mypy --config-file "$cfg" --show-error-context --show-column-numbers . | tee mypy.txt || true
          sed -nE 's#^([^:]+):([0-9]+):([0-9]+): error: (.*)$#::error file=\1,line=\2,col=\3,title=mypy::\4#p' mypy.txt
          python3 -m pytest --collect-only -q test 2>&1 | tee collect.txt || true
          grep -E '^(E |ERROR )' collect.txt | head -20 | sed -E 's/%/%25/g; s/^/::error title=pytest collection::/'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colcon-logs
          path: ros_ws/log
