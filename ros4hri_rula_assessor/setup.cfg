[develop]
script_dir=$base/lib/ros4hri_rula_assessor
[install]
install_scripts=$base/lib/ros4hri_rula_assessor
[flake8]
# ament_flake8's defaults with the house style of this package: double quotes, lines up to 120 characters
# C408 off: dict(key=value) calls are house style
extend-ignore = B902,C408,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I202
import-order-style = google
application-import-names = ros4hri_rula_assessor
max-line-length = 120
inline-quotes = "
multiline-quotes = """
docstring-quotes = """
show-source = true
statistics = true
